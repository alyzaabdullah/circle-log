<title>Circle Log — version test</title>
<style>
  /* Type system: one font family, four sizes (14 / 16 / 18 / 22), two weights (400 / 600), sentence case everywhere.
     Colour: one accent (green) + neutrals for the app. Warm yellow is reserved for test-only elements
     (banner, test tools) so testers can always tell what won't exist in the real app. No red anywhere. */
  :root {
    --paper: #f4f6f3;
    --raised: #ffffff;
    --ink: #1f2b27;
    --ink-soft: #55625b;
    --line: #d8ded9;
    --accent: #3e6b64;
    --accent-strong: #2c4e49;
    --accent-soft: #e0ebe7;
    --on-accent: #ffffff;
    --test: #fff7e1;
    --test-line: #e6d3a3;
    --test-ink: #6f5418;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
    --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px;
    --tap: 48px;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151c1a; --raised: #1e2825; --ink: #e9eeea; --ink-soft: #aab7b0; --line: #2e3b37;
      --accent: #7fb3a7; --accent-strong: #a6d0c5; --accent-soft: #24342f; --on-accent: #0f1f1b;
      --test: #2a2516; --test-line: #5a4b25; --test-ink: #e3c27c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151c1a; --raised: #1e2825; --ink: #e9eeea; --ink-soft: #aab7b0; --line: #2e3b37;
    --accent: #7fb3a7; --accent-strong: #a6d0c5; --accent-soft: #24342f; --on-accent: #0f1f1b;
    --test: #2a2516; --test-line: #5a4b25; --test-ink: #e3c27c; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--fs-md); font-weight: 400; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  h2 { font-size: var(--fs-xl); font-weight: 600; line-height: 1.3; text-wrap: balance; }
  h3 { font-size: var(--fs-lg); font-weight: 600; line-height: 1.35; }
  strong, b { font-weight: 600; }
  button, input, select, textarea { font-family: inherit; font-size: var(--fs-md); color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Test banner (persistent) */
  .banner { position: sticky; top: 0; z-index: 20; background: var(--test); border-bottom: 1px solid var(--test-line); color: var(--ink);
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    padding: 4px 16px; padding-top: max(4px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .banner p { font-size: var(--fs-sm); line-height: 1.35; flex: 1 1 0; min-width: 0; }
  .banner p span { display: block; color: var(--ink-soft); }
  .banner button { flex: 0 0 auto; }

  .shell { max-width: 1040px; margin: 0 auto; padding: 0 16px 56px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
  .brand { font-size: var(--fs-lg); font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .brandtxt { display: flex; flex-direction: column; line-height: 1.25; }
  .builtfor { font-size: var(--fs-sm); font-weight: 400; color: var(--ink-soft); }

  /* Test tools (test-only, so warm yellow) */
  .testbar { border: 1px dashed var(--test-line); background: var(--test); border-radius: var(--r); padding: 4px 12px 12px; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 20px; }
  .testbar .tl { font-size: var(--fs-sm); font-weight: 600; color: var(--test-ink); }
  .testbar .grow { flex: 1 1 auto; }
  .testbar label { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink-soft); }
  .testbar select { width: auto; min-width: 150px; }
  .testbar .note { flex-basis: 100%; font-size: var(--fs-sm); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--raised); }
  .seg button { border: 0; background: transparent; color: var(--ink-soft); font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* Building blocks */
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .stack.tight { gap: 6px; }
  .soft { color: var(--ink-soft); }
  .sm { font-size: var(--fs-sm); }
  .col { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row.between { justify-content: space-between; }
  .box { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .box.accent { background: var(--accent-soft); border-color: transparent; }
  .toast { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; border-radius: 12px; padding: 12px 16px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); border: 1px solid transparent; background: var(--accent); color: var(--on-accent);
    font-weight: 600; padding: 0 20px; border-radius: 12px; cursor: pointer; text-align: center; line-height: 1.25; }
  .btn:hover { background: var(--accent-strong); }
  .btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
  .btn.ghost { background: var(--raised); color: var(--accent-strong); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--accent); background: var(--accent-soft); }
  .btn.ghost:disabled { background: var(--raised); color: var(--ink-soft); }
  .btn.armed, .btn.ghost.armed { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent); }
  .btn.full { width: 100%; }
  .btn.tall { width: 100%; min-height: 56px; }
  .link { background: none; border: 0; padding: 0; min-height: 44px; color: var(--accent-strong); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
  .link.sm { font-size: var(--fs-sm); }

  .tag { display: inline-block; font-size: var(--fs-sm); font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }
  .tag.on { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Choices */
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, .q { font-size: var(--fs-lg); font-weight: 600; padding: 0; margin-bottom: 12px; display: block; }
  .q .opt-hint, legend .opt-hint { font-weight: 400; color: var(--ink-soft); }
  .num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-size: var(--fs-sm); font-weight: 600; margin-right: 10px; vertical-align: 2px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opts.two { display: grid; grid-template-columns: 1fr 1fr; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; text-align: left; border: 2px solid var(--line); background: var(--raised); color: var(--ink);
    font-weight: 400; padding: 10px 14px; border-radius: 12px; cursor: pointer; line-height: 1.35; }
  .opt:hover { border-color: var(--accent); }
  .opt .dot { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .opt[aria-pressed="true"] .dot { border-color: var(--accent); background: var(--accent); }
  .opt[aria-pressed="true"] .dot::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--on-accent); border-bottom: 2px solid var(--on-accent); transform: rotate(-45deg) translate(1px, -1px); }
  .opt .txt { flex: 1; min-width: 0; }
  textarea, input[type="text"], input[type="date"], select { background: var(--raised); border: 1px solid var(--ink-soft); border-radius: 10px; padding: 12px; width: 100%; min-height: var(--tap); }
  textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .check { display: flex; gap: 14px; align-items: flex-start; min-height: 56px; padding: 14px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--raised); }
  .check input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
  .check.on { border-color: var(--accent); background: var(--accent-soft); }
  .check .soft { display: block; }

  /* Lists */
  .rows > * { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .rows > *:last-child { border-bottom: 0; padding-bottom: 0; }
  .rows > *:first-child { padding-top: 0; }
  .track { background: var(--line); border-radius: 6px; height: 10px; overflow: hidden; }
  .fill { background: var(--accent); height: 100%; border-radius: 6px; transition: width .25s ease; }

  /* Facilitator */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .tabs button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--ink-soft); font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  @media (min-width: 640px) { .tabs { display: flex; flex-wrap: wrap; } }
  .fhead { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-bottom: 18px; }
  .fhead label { display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px; min-width: 0; font-size: var(--fs-sm); color: var(--ink-soft); }
  .fhead select { color: var(--ink); }
  .fgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (min-width: 900px) { .fgrid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
  .pairform { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  @media (min-width: 640px) { .pairform { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; } }
  .pairform label, .field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .person { display: flex; flex-direction: column; gap: 10px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acts .btn { padding: 0 10px; }
  .qrimg { background: #ffffff; padding: 10px; border-radius: 10px; width: 220px; max-width: 100%; align-self: center; }
  .qrimg svg { display: block; width: 100%; height: auto; }
  .url { font-size: var(--fs-sm); color: var(--ink-soft); word-break: break-all; }
  ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--fs-sm); color: var(--ink-soft); }

  /* First-launch walkthrough (full screen, like an app's onboarding) */
  body.onboarding .top, body.onboarding #testbar, body.onboarding footer { display: none; }
  body.onboarding .shell { padding-bottom: 0; }
  .ob { min-height: calc(100vh - 60px); min-height: calc(100svh - 60px); max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; padding: 8px 0 max(20px, env(safe-area-inset-bottom)); touch-action: pan-y; overflow-x: hidden; overflow-x: clip; }
  .ob-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
  .ob-top .seg button { min-height: 44px; }
  .ob-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 16px 8px; }
  .ob-art { width: 168px; height: 168px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .ob-art svg { width: 92px; height: 92px; }
  .ob-art.small { width: 96px; height: 96px; }
  .ob-art.small svg { width: 52px; height: 52px; }
  .ob-body h2 { max-width: 22ch; }
  .ob-body p { color: var(--ink-soft); max-width: 34ch; }
  .ob-dots { display: flex; justify-content: center; gap: 8px; margin: 8px 0 18px; }
  .ob-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: width .2s ease, background .2s ease; }
  .ob-dots span.on { width: 24px; border-radius: 4px; background: var(--accent); }
  .ob-foot { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .ob-foot.first { grid-template-columns: 1fr; }
  .ob-slide { animation: obIn .25s ease; }
  @keyframes obIn { from { opacity: 0; transform: translateX(var(--from, 16px)); } to { opacity: 1; transform: none; } }

  @media (max-width: 340px) { .opts.two { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .fill, .ob-dots span { transition: none; } .ob-slide { animation: none; } }
</style>
</head>

<div class="banner" role="note">
  <p>Version test — utilisez uniquement des prénoms fictifs <span lang="en">Test version — use fictional names only.</span></p>
  <button type="button" class="link sm" id="aboutbtn"></button>
</div>
<div class="shell">
  <header class="top">
    <div class="brand"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="4" style="color:var(--accent)"/></svg><span class="brandtxt">Circle Log<span class="builtfor" id="builtfor"></span></span></div>

    </div>
  </header>
  <div class="testbar" id="testbar"></div>
  <main id="app"></main>

</div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _modules = function(moduleCount) {

        for (var row = 0; row < moduleCount; row += 1) {

      setupPositionProbePattern(_moduleCount - 7, 0);

      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {

      if (_dataCache == null) {

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

              || (0 <= c && c <= 6 && (r == 0 || r == 6) )

          } else {
            _modules[row + r][col + c] = false;
          }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {

        }
        _modules[r][6] = (r % 2 == 0);

      for (var c = 8; c < _moduleCount - 8; c += 1) {

        }
        _modules[6][c] = (c % 2 == 0);

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

    var setupTypeInfo = function(test, maskPattern) {

      var bits = QRUtil.getBCHTypeInfo(data);

          _modules[i][8] = mod;
        } else if (i < 8) {

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

      .then(function () { ui.pickA = ui.pickB = ""; ui.pairErr = ""; fOk(t("pairAdded")); });
  }

  function renderCalls() {
    var n = cur(), ps = people();
    var lc = el("section", { class: "card stack", "aria-labelledby": "h-calls" }, [el("div", { class: "stack tight" }, [el("h2", { id: "h-calls", text: t("callsTitle", { n: n }) }), el("p", { class: "sm soft", text: t("callsHelp") })])]);
    if (ps.length < 2) {
      lc.appendChild(el("p", { class: "soft", text: t("callsNeedTwo") }));
      lc.appendChild(el("button", { type: "button", class: "btn", id: "goadd-calls", text: t("goAdd"), onclick: function () { goTab("people"); } }));
      app.appendChild(el("div", { class: "col", style: "margin:0;max-width:640px" }, [lc]));
      return;
    }
    var list = callsNow();
    if (!list.length) lc.appendChild(el("p", { class: "soft", text: t("noCalls") }));
    else lc.appendChild(el("div", { class: "rows" }, list.map(function (call) {
      var both = call.done_a && call.done_b, one = call.done_a || call.done_b, key = "rm:" + call.id, armed = ui.armed === key;
      return el("div", {}, [
        el("div", { class: "row between" }, [el("strong", { text: pname(call.participant_a) + " ↔ " + pname(call.participant_b) }),
          el("span", { class: "tag" + (both ? " on" : ""), text: both ? t("callStateDone") : one ? t("callStateHalf") : t("callStateNo") })]),
        isClosed() ? null : el("button", { type: "button", class: "btn ghost" + (armed ? " armed" : ""), style: "align-self:flex-start", text: armed ? t("removeConfirm") : t("removePair"), onclick: function () {
          if (!armed) { arm(key); render(); return; }
          db.remove("calls", call.id).then(function () { fOk(t("pairRemoved")); });
        } })
      ]);
    })));
    if (!isClosed()) {
      var opts = function (val, other) {
        return [el("option", { value: "", text: t("choose") })].concat(ps.map(function (p) {
          var paired = !!callFor(p.id), req = requestedSkillOf(p.id);
          return el("option", { value: p.id, selected: p.id === val, disabled: paired || p.id === other, text: p.display_name + (paired ? t("optPaired") : req ? t("optRequest", { skill: skillName(req) }) : "") });
        }));
      };
      lc.appendChild(el("div", { class: "stack tight", style: "border-top:1px solid var(--line);padding-top:16px" }, [
        el("h3", { text: t("newPair") }),
        el("div", { class: "pairform" }, [
          el("label", { for: "pick-a" }, [t("pickA"), el("select", { id: "pick-a", onchange: function (e) { ui.pickA = e.target.value; ui.pairErr = ""; lastFocusId = "pick-a"; render(); } }, opts(ui.pickA, ui.pickB))]),
          el("label", { for: "pick-b" }, [t("pickB"), el("select", { id: "pick-b", onchange: function (e) { ui.pickB = e.target.value; ui.pairErr = ""; lastFocusId = "pick-b"; render(); } }, opts(ui.pickB, ui.pickA))]),
          el("button", { type: "button", class: "btn", id: "addpair", text: t("addPair"), disabled: !(ui.pickA && ui.pickB), onclick: function () { addCall(ui.pickA, ui.pickB); } })
        ]),
        ui.pairErr ? el("p", { class: "box", role: "status", text: ui.pairErr }) : null
      ]));
    }
    app.appendChild(el("div", { class: "fgrid" }, [lc, pairingCard("h-req", false)]));
  }

  function qrSvg(text) {
    try { var qr = qrcode(0, "M"); qr.addData(text); qr.make(); return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return ""; }
  }
  function qrPanel(p) {
    var tok = activeToken(p.id);
    if (!tok) return null;
    var link = qrLink(tok.token), rc = replacedCount(p.id);
    var box = el("div", { class: "box", id: "qr-" + p.id, style: "text-align:center" }, [
      el("strong", { text: t("qrFor", { name: p.display_name }) }),
      el("div", { class: "qrimg", role: "img", "aria-label": t("qrFor", { name: p.display_name }), html: qrSvg(link) }),
      el("span", { class: "sm soft", text: t("qrIssued", { date: fmtDate(tok.issued_at) }) + (rc ? " · " + (rc === 1 ? t("qrReplaced1") : t("qrReplacedN", { n: rc })) : "") }),
      el("span", { class: "url", text: link }),
      el("button", { type: "button", class: "btn ghost full", text: t("copyLink"), onclick: function () { copyText(link, t("linkCopied")); } }),
      el("p", { class: "sm soft", text: t("qrSim") })
    ]);
    if (!isClosed()) {
      var key = "qr:" + p.id, armed = ui.armed === key;
      box.appendChild(el("button", { type: "button", class: "btn ghost full" + (armed ? " armed" : ""), id: "newqr-" + p.id, text: armed ? t("newQrConfirm") : t("newQr"), onclick: function () {
        if (!armed) { arm(key); lastFocusId = "newqr-" + p.id; render(); return; }
        var old = activeToken(p.id), now = Date.now();
        (old ? db.update("qr_tokens", old.id, { revoked_at: now }) : Promise.resolve())
          .then(function () { return db.insert("qr_tokens", { participant_id: p.id, token: randomId("", 10), issued_at: now, revoked_at: null }); })
          .then(function () { ui.openQr = p.id; lastFocusId = "newqr-" + p.id; fOk(t("newQrDone", { name: p.display_name })); });
      } }));
    }
    return box;
  }

  function renderPeople() {
    var col = el("div", { class: "col", style: "margin:0;max-width:640px" });
    if (!isClosed()) {
      var inp = el("input", { type: "text", id: "addname", maxlength: "30", autocomplete: "off", autocapitalize: "words", spellcheck: "false",
        oninput: function (e) { ui.addName = e.target.value; document.getElementById("addbtn").disabled = !e.target.value.trim(); } });
      inp.value = ui.addName;
      var doAdd = function () {
        var nm = (ui.addName || "").trim().replace(/\s+/g, " ");
        if (!nm) return;
        db.insert("participants", { cohort_id: cohort().id, display_name: nm, created_at: Date.now() })
          .then(function (p) { return db.insert("qr_tokens", { participant_id: p.id, token: randomId("", 10), issued_at: Date.now(), revoked_at: null }).then(function () { return p; }); })
          .then(function (p) {
            ui.addName = ""; ui.openQr = p.id; lastFocusId = "addname"; fOk(t("added", { name: p.display_name }));
            var q = document.getElementById("qr-" + p.id); if (q && q.scrollIntoView) q.scrollIntoView({ block: "center" });
          });
      };
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") doAdd(); });
      col.appendChild(el("section", { class: "card stack", "aria-labelledby": "h-add" }, [
        el("h2", { id: "h-add", text: t("addTitle") }),
        el("div", { class: "stack tight" }, [el("label", { for: "addname", class: "field", text: t("addLabel") }),
          el("div", { class: "addrow" }, [inp, el("button", { type: "button", class: "btn", id: "addbtn", text: t("addBtn"), disabled: !ui.addName.trim(), onclick: doAdd })])])
      ]));
    }
    var ps = people();
    var list = el("section", { class: "card stack", "aria-labelledby": "h-people" }, [el("h3", { id: "h-people", text: t("peopleList") })]);
    if (!ps.length) list.appendChild(el("p", { class: "soft", text: t("noPeopleYet") }));
    else list.appendChild(el("div", { class: "rows" }, ps.map(function (p) {
      var n = practicesOf(p.id).length, open = ui.openQr === p.id;
      return el("div", { class: "person", id: "person-" + p.id }, [
        el("div", { class: "row between" }, [el("strong", { text: p.display_name }), el("span", { class: "sm soft", text: n === 0 ? t("entries0") : n === 1 ? t("entries1") : t("entriesN", { n: n }) })]),
        el("div", { class: "acts" }, [
          el("button", { type: "button", class: "btn ghost", "aria-expanded": String(open), text: open ? t("hideQr") : t("showQr"), onclick: function () { ui.openQr = open ? null : p.id; ui.armed = null; render(); } }),
          el("button", { type: "button", class: "btn ghost", id: "csv-" + p.id, disabled: n === 0, text: t("exportCsv"), onclick: function () { exportCsv(p); } })
        ]),
        el("button", { type: "button", class: "link", text: t("openAs", { name: p.display_name }), onclick: function () { myPid = p.id; lsSet("circlelog-test-pid", p.id); setView("p"); } }),
        open ? qrPanel(p) : null
      ]);
    })));
    col.appendChild(list);
    app.appendChild(col);
  }

  function renderGroup() {
    var co = cohort(), col = el("div", { class: "col", style: "margin:0;max-width:640px" });
    if (ui.groupName == null) ui.groupName = co.name;
    var nameCard = el("section", { class: "card stack" }, [
      el("div", { class: "row between" }, [el("h2", { text: co.name }), el("span", { class: "tag" + (isClosed() ? "" : " on"), text: isClosed() ? t("statusClosed") : t("statusOpen") })]),
      el("p", { class: "sm soft", text: t("startedOn", { date: fmtDate(co.started_at) }) })
    ]);
    if (!isClosed()) {
      var gi = el("input", { type: "text", id: "groupname", maxlength: "40", value: ui.groupName, oninput: function (e) { ui.groupName = e.target.value; } });
      nameCard.appendChild(el("div", { class: "stack tight" }, [el("label", { for: "groupname", class: "field", text: t("groupName") }),
        el("div", { class: "addrow" }, [gi, el("button", { type: "button", class: "btn ghost", id: "savename", text: t("saveName"), onclick: function () {
          var nm = (ui.groupName || "").trim(); if (!nm) return;
          db.update("cohorts", co.id, { name: nm }).then(function () { fOk(t("nameSaved")); });
        } })])]));
    }
    col.appendChild(nameCard);

    var card = el("section", { class: "card stack", "aria-labelledby": "h-close" }, [el("h3", { id: "h-close", text: t("closeTitle") })]);
    if (isClosed()) {
      card.appendChild(el("div", { class: "box" }, [el("strong", { text: t("closedInfo", { a: fmtDate(co.closed_at), b: fmtDate(co.delete_after) }) }), el("span", { class: "sm soft", text: t("closedSim") })]));
      card.appendChild(el("button", { type: "button", class: "btn ghost", id: "reopen", text: t("reopen"), onclick: function () { db.update("cohorts", co.id, { status: "open", closed_at: null, delete_after: null }).then(function () { fOk(""); }); } }));
    } else {
      card.appendChild(el("p", { class: "soft", text: t("closeHelp") }));
      if (!ui.deleteDate) ui.deleteDate = ymd(Date.now() + 30 * DAY);
      card.appendChild(el("div", { class: "stack tight" }, [el("label", { for: "deldate", class: "field", text: t("deleteDate") }),
        el("input", { type: "date", id: "deldate", value: ui.deleteDate, min: ymd(Date.now() + DAY), onchange: function (e) { ui.deleteDate = e.target.value; ui.armed = null; render(); } })]));
      var parts = (ui.deleteDate || "").split("-"), delTs = parts.length === 3 ? new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12).getTime() : NaN;
      var validDate = !isNaN(delTs) && delTs > Date.now(), armed = ui.armed === "close";
      if (!validDate) card.appendChild(el("p", { class: "box", role: "status", text: t("dateFuture") }));
      card.appendChild(el("button", { type: "button", class: "btn ghost" + (armed ? " armed" : ""), id: "closegroup", disabled: !validDate, text: armed ? t("closeConfirm") : t("closeBtn"), onclick: function () {
        if (!armed) { arm("close"); render(); return; }
        db.update("cohorts", co.id, { status: "closed", closed_at: Date.now(), delete_after: delTs }).then(function () { fOk(""); });
      } }));
      card.appendChild(el("p", { class: "sm soft", text: t("closedSim") }));
    }
    col.appendChild(card);
    app.appendChild(col);
  }

  /* ---------- Review summary + clipboard ---------- */
  function reviewText(rows) {
    var lines = [t("reviewTitle", { n: cur() }) + " · " + skillName("s" + cur()), ""];
    rows.forEach(function (r) {
      var parts = [r.p.display_name + " : " + (r.count ? t("nThisWeek", { n: r.count }) : t("zeroThisWeek"))];
      parts.push(r.call === "done" ? t("callStateDone") : r.call === "no" ? t("callStateNo") : t("callStateNone"));
      if (r.goal) parts.push(t("goalShort", { a: r.gp.count, b: r.goal.target_count }) + " (" + skillName(r.goal.skill_id) + ")");
      lines.push("- " + parts.join(" · "));
    });
    var reqs = openRequests();
    if (reqs.length) { lines.push("", t("secPairing") + " :"); reqs.forEach(function (r) { lines.push("- " + skillName(r.skill) + " : " + joinNames(r.pids.map(pname))); }); }
    return lines.join("\n");
  }
  function copyText(txt, okMsg) {
    function fallback() {
      try {
        var ta = el("textarea", { style: "position:fixed;top:0;left:0;opacity:0", readonly: "readonly" }); ta.value = txt;
        document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); ta.remove();
        fOk(ok ? okMsg : t("copyFail"));
      } catch (e) { fOk(t("copyFail")); }
    }
    try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { fOk(okMsg); }, fallback); else fallback(); } catch (e) { fallback(); }
  }

  /* ---------- CSV export: one participant, UTF-8 with BOM, comma-separated ---------- */
  function csvCell(v) {
    var s = v == null ? "" : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;            // keep spreadsheet apps from reading a note as a formula
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function slug(s) {
    var x = s; try { x = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {}
    return x.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "participant";
  }
  function buildCsv(p) {
    var head = [t("csvDate"), t("csvPerson"), t("csvSession"), t("csvSkill"), t("csvWith"), t("csvHow"), t("csvPartner"), t("csvNote")];
    var rows = practicesOf(p.id).slice().reverse().map(function (pr) {
      var d = new Date(pr.practiced_at);
      return [ymd(pr.practiced_at) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()), p.display_name, pr.session, skillName(pr.skill_id),
        L(byId(WHO, pr.who_with)), L(byId(OUTCOMES, pr.outcome)), pr.partner_request ? t("yes") : t("no"), pr.note || ""].map(csvCell).join(",");
    });
    return "﻿" + [head.map(csvCell).join(",")].concat(rows).join("\r\n") + "\r\n";
  }
  function exportCsv(p) {
    var csv = buildCsv(p), filename = "circle-log-" + slug(p.display_name) + "-" + ymd(Date.now()) + ".csv", standalone = false;
    try { standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; } catch (e) {}
    try {
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      // Home-screen apps on phones often can't download files; the share sheet ("Save to Files") works there.
      if (standalone && window.File && navigator.canShare) {
        var file = new File([blob], filename, { type: "text/csv" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: filename }).then(function () { fOk(t("exported", { file: filename })); }, function (e) { if (e && e.name === "AbortError") return; fOk(t("exportFail")); });
          return;
        }
      }
      var url = URL.createObjectURL(blob), a = el("a", { href: url, download: filename, style: "display:none" });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      fOk(t("exported", { file: filename }));
    } catch (e) { fOk(t("exportFail")); }
  }

  /* ================================================================== */
  /* Start                                                               */
  /* ================================================================== */
  function start() {
    data = readStored();
    if (!data) { data = freshPilot(); mirror(); }
    // Arriving from a (simulated) QR link: ?t=<token>
    var token = null;
    try { token = new URLSearchParams(location.search).get("t"); } catch (e) {}
    if (token) {
      var row = db.select("qr_tokens", { token: token })[0];
      view = "p"; lsSet("circlelog-test-view", "p");
      if (row && !row.revoked_at && db.get("participants", row.participant_id)) {
        myPid = row.participant_id; lsSet("circlelog-test-pid", myPid);
        ui.pToast = t("tokOk", { name: pname(myPid) });
      } else {
        myPid = null; lsSet("circlelog-test-pid", null);
        ui.tokenState = row ? "revoked" : "unknown";
      }
      // Take the token out of the address bar so it isn't bookmarked or shared.
      try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    }
    render();
  }

  document.getElementById("lang-fr").addEventListener("click", function () { setLang("fr"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  document.getElementById("aboutbtn").addEventListener("click", function () { ui.about = !ui.about; ui.armed = null; render(); window.scrollTo(0, 0); });
  // Another tab of this test version on the same device changed the data: show it.
  window.addEventListener("storage", function (e) {
    if (e.key !== DATA_KEY) return;
    var a = document.activeElement;
    if (a && (a.id === "note" || a.id === "addname" || a.id === "groupname")) return;   // don't interrupt typing
    var d = readStored(); if (d) { data = d; render(); }
  });

  start();
})();
</script>
